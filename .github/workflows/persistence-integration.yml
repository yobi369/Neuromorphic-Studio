name: PostgreSQL persistence integration
on:
  push:
    branches: [main, "product/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: neuromorphic
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: neuromorphic_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U neuromorphic -d neuromorphic_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://neuromorphic:test-password@localhost:5432/neuromorphic_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: node --import tsx --test tests/integration/*.test.ts
